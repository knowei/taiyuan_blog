version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: taiyuan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "taiyuan_blog"
      MYSQL_USER: "remote_user"
      MYSQL_PASSWORD: "remote_pass"
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - taiyuan-network

  redis:
    image: redis:5.0
    container_name: taiyuan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - taiyuan-network

  taiyuan-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taiyuan-admin
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
    restart: unless-stopped
    networks:
      - taiyuan-network

  taiyuan-front:
    build:
      context: ./taiyuan-front
      dockerfile: Dockerfile
    container_name: taiyuan-front
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - taiyuan-admin
    networks:
      - taiyuan-network


  taiyuan-web:
    build:
      context: ./taiyuan-web
      dockerfile: Dockerfile
    container_name: taiyuan-web
    ports:
      - "8088:8088"
    restart: unless-stopped
    depends_on:
      - taiyuan-admin
    environment:
      VUE_APP_API: "http://taiyuan-admin:8080" # 动态注入 API 地址
    networks:
      - taiyuan-network

volumes:
  mysql_data:
  redis_data:

networks:
  taiyuan-network:
    driver: bridge